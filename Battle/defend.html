<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defend The Keep</title>
    <link rel="stylesheet" href="defend.css">
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
</head>
<body>

    <div id="battle-ui">
        <div class="team-stat player-stat">
            <span id="army-count">Your Army: 0</span>
        </div>
        <div class="phase-indicator">
            <span id="phase-text">DEFEND</span>
        </div>
        <div class="team-stat enemy-stat">
            <span id="enemy-count">Enemies: 0</span>
        </div>
        <button id="btn-retreat" onclick="retreat()">Retreat</button>
    </div>

    <div id="army-setup-modal" class="modal">
        <div class="modal-content">
            <h2>Prepare Your Defenses!</h2>
            <p>The enemy is attacking from all sides. How many troops will defend the King?</p>
            <input type="number" id="troop-input" min="1" max="400" value="50">
            <button onclick="confirmDefenses()">Position Troops</button>
            <button id="start-clash-btn" style="display:none; margin-top: 15px;" onclick="startWave()">Start Defense</button>
        </div>
    </div>

    <canvas id="battleCanvas"></canvas>

    <div id="ability-bar">
        <button id="btn-explosion" onclick="castExplosion()">💥 EXPLOSION</button>
    </div>

    <div id="fx-container"></div>

    <script src="defend.js"></script>
</body>
</html>
